[project]
name = "shenbi"
version = "0.1.0"
description = "Shenbi novel-writing AI skill framework"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ThomasChangX" }]
requires-python = ">=3.11"
dependencies = [
    "jieba==0.42.1",
    "pydantic>=2.5.0",        # gates/G2 schemas 生产使用
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    # 注：去除 patch>=1.16（unmaintained since 2016, codebase 用 unittest.mock）
    # 注：去除 click>=8.1.7（CLI 用 stdlib argparse，无需第三方框架；如未来需要 rich CLI 再加）
    # 注：sentence-transformers 与 numpy 移至 [project.optional-dependencies].embeddings
    #     避免 core install 拉入 torch/CUDA 等大型 ML 依赖
    "openai>=3.1.0",
    "tenacity>=8.0.0",
]
[project.optional-dependencies]
# numpy 封顶 <2.5：2.5.0 面向 python>=3.12 且其 stubs 用 PEP 695 语法，
# 在 F0-06 统一的 mypy 3.11 检查基准下不可解析（CI 3.12 leg 实炸）；
# 3.11 下限项目消费 2.5+ 也与 requires-python 语义相悖。
embeddings = ["sentence-transformers>=5.7.0", "numpy>=1.26.0,<2.5"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-benchmark>=4.0.0",
    "pytest-randomly>=3.15.0",
    "hypothesis>=6.168.0",
    "mypy>=1.8.0",
    "basedpyright>=1.39.10",
    "ruff>=0.1.13",
    "pre-commit>=3.6.0",
    "pip-audit>=2.7.0",
    "cyclonedx-bom>=7.3.1",
    "coverage>=7.4.0",
    "yamllint>=1.33.0",
    "git-cliff>=2.4.0",
    "types-PyYAML>=6.0.12",
    "sentence-transformers>=5.7.0",
    "shellcheck-py>=0.11.0.1",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material[imaging]>=9.5.4",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=11.0.1",
]

[project.scripts]
shenbi-validate = "shenbi.gates.cli:main"
shenbi-dispatch = "shenbi.dispatcher.cli:main"
shenbi-score = "shenbi.scoring:main"
shenbi-phase = "shenbi.phase_runner:main"
shenbi-sync-contracts = "shenbi.sync_contracts:main"
shenbi-generate-plugins = "shenbi.plugins.generate:main"
shenbi-cost = "shenbi.cost.report:main"
shenbi-facts = "shenbi.facts.cli:main"
pipeline = "shenbi.pipeline.cli:main"
pipeline-truth-index = "shenbi.pipeline.truth_index:main"
pipeline-truth-embed = "shenbi.pipeline.truth_embed:main"
pipeline-context-assemble = "shenbi.pipeline.context_assemble:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shenbi"]

[[tool.mypy.overrides]]
# Pydantic v2 @computed_field stacks on @property — mypy's prop-decorator
# check rejects this. It's the official pydantic pattern; disable per-module.
module = "shenbi.contracts.*"
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = "jieba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tenacity.*"
ignore_missing_imports = true


[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "novel-output/",
]

[tool.ruff.lint]
select = [
    "BLE",
    "E", "F", "W",
    "I",
    "N",
    "B",
    "A",
    "C4",
    "PIE", "RET", "SIM",
    "PL",
    "UP",
    "RUF",
    "D",
    "T20",
]
ignore = [
    "D100", "D104",
    "PLR0913",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests legitimately aggregate unexpected failures (BLE001) and print
