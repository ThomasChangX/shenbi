warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[tool.basedpyright]
include = ["tests", "src/shenbi"]
exclude = [
    "**/__pycache__",
    # P-1.A: legacy untyped code; P-1.D PR-12 removes these exclusions
]
typeCheckingMode = "strict"
pythonVersion = "3.11"
# tools/ holds repo lints imported by unit tests (tools/__init__.py makes it a
# package; "." puts the repo root on the import search path so they resolve).
extraPaths = ["."]
reportMissingTypeStubs = "none"
# Unknown-family rules downgraded to none for JSON/YAML dict access.
# Gates load heterogeneous external data (progress.json, deps.json, etc.)
# via jload/yload returning dict[str, Any]. Value access propagates Any,
# which strict mode flags as Unknown. These rules catch noise, not bugs —
# real type errors are still caught by reportArgumentType,
# reportPossiblyUnboundVariable, reportIndexIssue, reportUnnecessaryIsInstance.
# TypedDicts at boundaries would be the "proper" fix but require ongoing
# schema maintenance that doesn't suit this project's evolution stage.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"

# Per-directory overrides via executionEnvironments (basedpyright's
# supported mechanism — [[tool.basedpyright.overrides]] is not recognized).
# Rationale and revisit plan: docs/basedpyright-overrides.md
executionEnvironments = [
  # tests/: industry-norm relaxation for test code (Mock, fixtures, dynamic setattr).
  { root = "tests", reportUnusedVariable = "none", reportUnusedFunction = "none", reportUnusedImport = "none", reportUnknownVariableType = "none", reportUnknownLambdaType = "none", reportUnknownParameterType = "none", reportUnknownArgumentType = "none", reportUnknownMemberType = "none", reportMissingParameterType = "none", reportPrivateUsage = "none" },
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = [
    "tests/fixtures",
    "tests/baselines",
    "tests/coverage",
    "tests/tiers",
    "tests/dispatcher",
    "tests/skill-behavior",
    "tests/skill-triggering",
    ".hypothesis",
]
addopts = [
    "--strict-markers",
    "--timeout=60",
    "--timeout-method=thread",
    "--benchmark-min-rounds=5",
    "--benchmark-warmup=on",
]
markers = [
    "unit: fast unit tests",
    "integration: cross-module tests",
    "property: Hypothesis property-based tests",
    "benchmark: pytest-benchmark performance tests",
    "slow: > 5s tests",
    "last: tests that must run after all others (e.g., coverage threshold)",
    "c13_regression: C13 cluster violation-construction flip tests (spec #39)",
]

[tool.coverage.run]
branch = true
source = ["src/shenbi"]

[tool.coverage.report]
# Permanent floor (F0-08): global line coverage must stay >=85%.
# The old >=90%/89 narrative described the earlier gate; the enforced
# value is 85 (Windows skips 2 G7 chmod tests; see skipif(win32)).
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
