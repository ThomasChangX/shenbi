name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags：changelog range 与 SBOM 均需（spec #63 audit-T5 C-3）
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # Spec #41 (C27) R2: SBOM 按组分层（F1041——environment 子命令无法分组，
      # requirements 子命令缺许可证元数据）。按组 sync + environment 读 dist-info。
      # prod=分发面（--no-dev --all-extras）；dev/docs 组不分发，仅溯源。
      - run: uv sync --frozen --only-group docs
      - run: uvx --from cyclonedx-bom cyclonedx-py environment .venv/bin/python
          --output-reproducible -o sbom-docs.cdx.json
      - run: uv sync --frozen --no-dev --all-extras
      - run: uvx --from cyclonedx-bom cyclonedx-py environment .venv/bin/python
          --output-reproducible -o sbom-prod.cdx.json
      - run: uv sync --frozen --only-group dev
      - run: uvx --from cyclonedx-bom cyclonedx-py environment .venv/bin/python
          --output-reproducible -o sbom-dev.cdx.json
      - name: Build sdist and wheel
        run: uv build
      - name: Generate changelog for tag  # git-cliff, conventional grouping (spec #63 F1021)
        id: changelog
        run: |
          # 发布时点 HEAD 已带新 tag：--unreleased 会滤掉全部已标记提交产出空 notes，
          # 故有 prev tag 时用 range、首个 tag 时用 --latest（audit-T5 C-1/C-2，spec #63）
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$prev_tag" ]; then
            notes=$(uvx git-cliff@2.13.1 ${prev_tag}..HEAD --strip header)
          else
            # First release tag: the latest tag section covers the full history
            notes=$(uvx git-cliff@2.13.1 --latest --strip header)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom-prod.cdx.json
            sbom-dev.cdx.json
            sbom-docs.cdx.json
