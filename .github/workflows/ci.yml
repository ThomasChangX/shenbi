name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # PR: allow independent completion so macOS infra timeouts don't cancel ubuntu.
      # push(main): full visibility, no early cancel.
      fail-fast: false
      matrix:
        # Windows removed — defensive support, not a target platform.
        # See .github/workflows/nightly.yml windows-smoke for fallback
        # code regression protection (dispatch-only).
        os: [ubuntu-latest, macos-latest]
        # PR: 3.11 + 3.12 only. push(main): adds 3.13 (migration monitoring).
        python-version: ${{ github.event_name == 'pull_request'
                && fromJson('["3.11", "3.12"]')
                || fromJson('["3.11", "3.12", "3.13"]') }}
    # 3.13 allow-failure during rollout. macOS allow-failure for uv sync timeouts.
    continue-on-error: >-
      ${{ matrix.python-version == '3.13' || contains(matrix.os, 'macos') }}
    env:
      # Default all file I/O and stdout to UTF-8 on every OS. The framework
      # reads/writes CJK content; without this, Windows falls back to cp1252
      # and crashes with UnicodeEncode/DecodeError. (Code also sets encoding=
      # explicitly; this covers subprocesses and prints.)
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install ${{ matrix.python-version }}
      - name: Verify uv.lock is up to date
        run: uv lock --check
      - run: uv sync --frozen --group dev
      - name: Install just 1.58.0 (pinned)  # spec #63 C25
        # PyPI 'just' (kootenpv/just) is an unrelated Python tool — the real
        # task runner must come from its release artifacts, never via uvx's
        # PyPI package resolution.
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - name: Single-source checks (justfile is the authority)  # spec #63 C25
        run: just check
      - name: Hypothesis replay statistics (C17 T1, spec 55)
        # Visible proof that property tests run in CI. Statistics alone are
        # not the replay proof — the fresh-clone injection red-light is the
        # mechanism anchor (spec #55 acceptance 1) — this makes the property
        # execution surface inspectable in workflow logs.
        run: >-
          uv run pytest tests/property -q --no-cov
          --hypothesis-profile=ci --hypothesis-show-statistics

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review (license + vulnerability)
        uses: actions/dependency-review-action@v4

  action-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Validate GitHub Actions YAML
        run: uv run yamllint --strict .github/workflows/
