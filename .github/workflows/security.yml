name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # F912 (spec #41 R4): 使 SECURITY.md "pip-audit runs on every PR and weekly" 的
    # weekly 半句成真；周一 03:00 UTC，与 codeql 周一 cron、autoupdate 周一 02:00 错峰
    - cron: "0 3 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Spec #41 (C27) R1: 审计对象 = uv.lock 全集（--all-groups 含 docs 组，
      # --all-extras 含 embeddings；默认 export 仅 prod+dev 是 T1303 盲区）。
      # C25 (#63) 合写面：本 audit 步骤归 spec #41 R1 所有，C25 侧清单对账勿重排。
      - run: uv export --frozen --all-groups --all-extras --no-emit-project -o req-audit.txt
      - run: uv run pip-audit -r req-audit.txt --no-deps --disable-pip
      - run: uv run cyclonedx-py requirements --output-reproducible -o sbom.cdx.json req-audit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
