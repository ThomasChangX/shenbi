name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # F912 (spec #41 R4): 使 SECURITY.md "pip-audit runs on every PR and weekly" 的
    # weekly 半句成真；周一 03:00 UTC，与 codeql 周一 cron、autoupdate 周一 02:00 错峰
    - cron: "0 3 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Spec #41 (C27) R1: 审计对象 = uv.lock 全集（--all-groups 含 docs 组，
      # --all-extras 含 embeddings；默认 export 仅 prod+dev 是 T1303 盲区）。
      # C25 (#63) 合写面：本 audit 步骤归 spec #41 R1 所有，C25 侧清单对账勿重排。
      - run: uv export --frozen --all-groups --all-extras --no-emit-project -o req-audit.txt
      - run: uv run pip-audit -r req-audit.txt --no-deps --disable-pip
      # Spec #41 (C27) R2: SBOM 按组分层（F1041——environment 子命令无法分组，
      # 且 dev/docs 组不分发）。prod 必须 --no-dev（默认 export 是 prod+dev）。
      # 注：uv 不允许 --only-group 与 --all-extras 同用；extras 不属于 dev/docs 组，
      # dev 组 SBOM 仍含 ML 栈（sentence-transformers 是 dev 直接依赖）。
      - run: uv export --frozen --no-dev --all-extras --no-emit-project -o req-prod.txt
      - run: uv export --frozen --only-group dev --no-emit-project -o req-dev.txt
      - run: uv export --frozen --only-group docs --no-emit-project -o req-docs.txt
      - run: uv run cyclonedx-py requirements
          --output-reproducible -o sbom-prod.cdx.json req-prod.txt
      - run: uv run cyclonedx-py requirements
          --output-reproducible -o sbom-dev.cdx.json req-dev.txt
      - run: uv run cyclonedx-py requirements
          --output-reproducible -o sbom-docs.cdx.json req-docs.txt
      # Spec #41 (C27) R2+R3: 许可证例外表 + ignore-vuln 豁免机械执法（T1304 闭环规则）。
      # Task 3 落地 tools/check_licenses.py 后启用（本 task 时脚本尚不存在，启用即 CI 红）：
      # - run: >-
      #     uv run python tools/check_licenses.py
      #     sbom-prod.cdx.json sbom-dev.cdx.json sbom-docs.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom-prod.cdx.json
            sbom-dev.cdx.json
            sbom-docs.cdx.json
