[default]
# Spec #33 T1a: per-skill rollback for helper precompute injection.
# List skills to fall back to the pure-prompt path, e.g.
# helper_injection_disabled = ["shenbi-style-learning"]
temperature = 0.7
max_tokens = 16384

[overrides."shenbi-chapter-drafting"]
temperature = 0.85
# Spec §2.2: drafting AVG output 15,787 tokens (96% of old 16384 cap).
# Raised to 32768 to eliminate truncation. PRE-DEPLOYMENT: probe
# `deepseek-v4-flash` with max_tokens=32768 to confirm model accepts it.
# If model hard-limits below 32768, root cause shifts to "chapter too long"
# (prompt-content layer, out of scope — see spec §2.9 fail-fast).
max_tokens = 32768

[overrides."shenbi-chapter-revision"]
temperature = 0.6
# Probe session 2026-09-29: revision outputs the COMPLETE revised chapter
# (same output shape as drafting) but had NO max_tokens override — the 16384
# default truncated every expansion (73 calls, completion tokens pinned at
# exactly 16384/32768 = cap values). Parity with drafting's 32768.
max_tokens = 32768

[overrides."shenbi-faction-builder"]
temperature = 0.7
# Fixcheck escalation #2 (2026-09-29): the single create_or_overwrite
# world/factions.md rides the output cap — 3 dispatch cycles pinned at
# 32766-32767 under the 32768 runtime raise (probe 2026-09-28 only fit by
# luck at 30516). API accepts 49152 (probe lifecycle completed 41625).
max_tokens = 49152

[overrides."shenbi-state-settling"]
temperature = 0.7
# Fixcheck ch1 escalation (2026-09-29): the six-file staging write set with a
# live-base character_matrix rebuild pins the 32768 raise (completion 32771);
# natural six-file output is 12-25K, the rebuild instruction pushes past 32K.
# Same headroom tier as foreshadowing-lifecycle (overlapping truth writes).
max_tokens = 49152

[overrides."shenbi-review-continuity"]
temperature = 0.2

[overrides."shenbi-review-anti-ai"]
temperature = 0.15

[overrides."shenbi-review-resonance"]
temperature = 0.1

[overrides."shenbi-foreshadowing-lifecycle"]
temperature = 0.5
# Canary escalation #15: write-discipline alone insufficient (whole-pool
# rewrite despite SKILL rule) — combined headroom so truncated merges stop
# silently dropping trailing hooks; monitor completion_tokens, revisit if
# sustained >30K.
max_tokens = 49152

# Spec §2.1 P0: score-* (most deterministic task) + discriminative review queue.
# Evaluative queue (texture/reader-pull/highpoint/pacing/long-span/motivation/
